name: Release installers

on:
  push:
    tags:
      - "v*"
  # Dispatching from a branch builds, signs and scans everything but skips
  # publishing, so it doubles as a dry run of the release gates.
  workflow_dispatch:

# Read-only by default; only the publish job gets write access.
permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency scan
    uses: ./.github/workflows/dependency-scan.yml

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Sync version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --sync

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --check

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Import Apple Developer certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build DMG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify macOS update artifacts
        run: node scripts/verify-release-artifacts.mjs macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coroslink-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Sync version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --sync

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --check

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:linux

      - name: Verify Linux update artifacts
        run: node scripts/verify-release-artifacts.mjs linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coroslink-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Sync version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --sync

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --check

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build NSIS installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Verify Windows update artifacts
        run: node scripts/verify-release-artifacts.mjs windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coroslink-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  malware-scan:
    name: Malware scan
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Only @electron/asar is needed here, so skip Electron's binary download.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install ClamAV and unpackers
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam p7zip-full squashfs-tools unzip
          # The package starts a background updater; update once, in the foreground.
          sudo systemctl stop clamav-freshclam

      - name: Update ClamAV signatures
        run: |
          for attempt in 1 2 3; do
            if sudo freshclam --stdout; then
              exit 0
            fi
            echo "freshclam attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          echo "::error::Could not download current ClamAV signatures"
          exit 1

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coroslink-*
          path: release

      - name: Scan installers and unpacked apps
        run: bash scripts/scan-release-artifacts.sh release

  release:
    name: Publish GitHub Release
    needs: [dependency-scan, malware-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Extract release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/test-release-notes.mjs
          node scripts/extract-release-notes.mjs "$RELEASE_TAG" release-notes.md

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coroslink-*
          path: release

      - name: Write SHA-256 checksums
        working-directory: release
        run: |
          for platform in */; do
            (cd "$platform" && sha256sum -- *)
          done | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: false
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release/*/*
            release/SHA256SUMS.txt
