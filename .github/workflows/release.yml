name: Release installers

on:
  push:
    tags:
      - "v*"
  # Dispatching from a branch builds, signs and scans dependencies but skips
  # publishing, so it doubles as a dry run of the release.
  workflow_dispatch:

# Read-only by default; only the publish job gets write access.
permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency scan
    uses: ./.github/workflows/dependency-scan.yml

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --sync

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Import Apple Developer certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build DMG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify macOS update artifacts
        run: node scripts/verify-release-artifacts.mjs macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coroslink-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --sync

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:linux

      - name: Verify Linux update artifacts
        run: node scripts/verify-release-artifacts.mjs linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coroslink-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --sync

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build NSIS installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Verify Windows update artifacts
        run: node scripts/verify-release-artifacts.mjs windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coroslink-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  release:
    name: Publish GitHub Release
    needs: [dependency-scan, macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Extract release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/test-release-notes.mjs
          node scripts/extract-release-notes.mjs "$RELEASE_TAG" release-notes.md

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coroslink-*
          path: release

      - name: Write SHA-256 checksums
        working-directory: release
        run: |
          for platform in */; do
            (cd "$platform" && sha256sum -- *)
          done | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: false
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release/*/*
            release/SHA256SUMS.txt
