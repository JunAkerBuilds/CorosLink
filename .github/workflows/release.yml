name: Release C-LINK (draft)

# C-LINK ships as the next CorosLink update: same app id, same repo, so a published release here is offered to every
# CorosLink user on a Mac. This workflow therefore never publishes. It builds, signs and notarizes the Mac app and
# uploads it to a DRAFT release, which the updater can't see. Going live is a person pressing "Publish release" on
# GitHub (with stagingPercentage set in latest-mac.yml for a staged rollout).
#
# Windows and Linux are built for betas only, with clink.yml / clink-linux.yml: latest.yml / latest-linux.yml are
# never made, so CorosLink on Windows and Linux keeps CorosLink releases.
#
# Tags (docs/releases.md): v0.2.0-clink.N makes a draft PRERELEASE with clink-mac.yml, the opt-in beta: once
# published, only CorosLink installs that opted in to C-LINK (and C-LINK betas) take it; everyone else stays on
# CorosLink. v0.2.0 makes a draft release with latest-mac.yml: once published, every CorosLink on a Mac takes it.
# Dispatching it by hand builds and signs without making any release (a dry run).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OSV-Scanner
        run: |
          mkdir -p "$RUNNER_TEMP/osv-scanner"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner/osv-scanner"

      - name: Scan npm dependencies
        run: '"$RUNNER_TEMP/osv-scanner/osv-scanner" scan source --lockfile package-lock.json'

  macos:
    name: macOS app
    needs: [check, dependency-scan]
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:version -- "$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Local mode's Bluetooth helper (native/ble), one universal binary for both app architectures.
      - name: Build clink-ble (Apple silicon + Intel)
        working-directory: native/ble
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/clink-ble \
            target/aarch64-apple-darwin/release/clink-ble target/x86_64-apple-darwin/release/clink-ble
          lipo -info target/release/clink-ble
          target/release/clink-ble --version

      - name: Fetch yt-dlp and ffmpeg for both architectures
        run: |
          node scripts/prepare-binaries.mjs --platform=darwin --arch=arm64
          node scripts/prepare-binaries.mjs --platform=darwin --arch=x64

      - name: Import Apple Developer certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      # The update has to land on CorosLink's install: same app id, signed by the same team.
      - name: Verify app id, signature and feed
        run: |
          set -euo pipefail
          for app in release/mac*/C-LINK.app; do
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")
            [ "$id" = "app.coroslink" ] || { echo "$app has bundle id $id, not app.coroslink"; exit 1; }
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID" || { echo "$app isn't signed by $APPLE_TEAM_ID"; exit 1; }
            xcrun stapler validate "$app"
            test -x "$app/Contents/Resources/clink-ble"
          done
          # latest-mac.yml for a release, clink-mac.yml for a beta (v0.2.0-clink.N).
          feed=$(ls release/*-mac.yml)
          [ "$(echo "$feed" | wc -l)" -eq 1 ] || { echo "Expected one mac feed, got: $feed"; exit 1; }
          case "$GITHUB_REF_NAME" in
            *-clink.*) [ "$feed" = "release/clink-mac.yml" ] || { echo "A beta must make clink-mac.yml, not $feed"; exit 1; } ;;
            *) [ "$feed" = "release/latest-mac.yml" ] || [ "$GITHUB_REF_TYPE" != "tag" ] || { echo "A release must make latest-mac.yml, not $feed"; exit 1; } ;;
          esac
          grep -q '^minimumSystemVersion:' "$feed"
          if ls release/latest.yml release/latest-linux.yml 2>/dev/null; then
            echo "A Windows or Linux feed was made; CorosLink there must stay on 0.1.x"; exit 1
          fi
          cat "$feed"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clink-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*-mac.yml

  # Windows and Linux: betas only (v0.2.0-clink.N) for now. A beta makes clink.yml / clink-linux.yml, which no
  # CorosLink install reads (CorosLink there reads latest.yml from the newest full release), so only people who
  # download the beta and later C-LINK betas take it. A stable tag skips these jobs until C-LINK replaces CorosLink there.
  windows:
    name: Windows installer
    needs: [check, dependency-scan]
    if: contains(github.ref_name, '-clink.') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:version -- "$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build clink-ble
        working-directory: native/ble
        run: |
          cargo build --release --locked
          target/release/clink-ble.exe --version

      - name: Fetch yt-dlp and ffmpeg
        run: node scripts/prepare-binaries.mjs --platform=win32 --arch=x64

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Verify installer and feed
        run: |
          set -euo pipefail
          ls -la release
          ls release/*.exe
          test -f release/win-unpacked/resources/clink-ble.exe
          if ls release/latest.yml 2>/dev/null; then
            case "$GITHUB_REF_NAME" in *-clink.*) echo "A beta must not make latest.yml"; exit 1 ;; esac
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test -f release/clink.yml; cat release/clink.yml; fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clink-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/clink.yml

  linux:
    name: Linux AppImage and deb
    needs: [check, dependency-scan]
    if: contains(github.ref_name, '-clink.') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:version -- "$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # clink-ble pairs through BlueZ over D-Bus.
      - name: Install D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build clink-ble
        working-directory: native/ble
        run: |
          cargo build --release --locked
          target/release/clink-ble --version

      - name: Fetch yt-dlp and ffmpeg
        run: node scripts/prepare-binaries.mjs --platform=linux --arch=x64

      - name: Build AppImage and deb
        run: npm run dist:linux

      - name: Verify packages and feed
        run: |
          set -euo pipefail
          ls -la release
          ls release/*.AppImage release/*.deb
          test -x release/linux-unpacked/resources/clink-ble
          if ls release/latest-linux.yml 2>/dev/null; then
            case "$GITHUB_REF_NAME" in *-clink.*) echo "A beta must not make latest-linux.yml"; exit 1 ;; esac
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test -f release/clink-linux.yml; cat release/clink-linux.yml; fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clink-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/clink-linux.yml

  draft:
    name: Draft GitHub release
    needs: [macos, windows, linux]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.macos.result == 'success'
      && needs.windows.result != 'failure' && needs.linux.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clink-*
          merge-multiple: true
          path: release

      - name: Write SHA-256 checksums
        working-directory: release
        run: sha256sum -- * | sort -k2 > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      # draft: true is the whole point of this workflow. Never change it to false here: publishing is done by hand.
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: C-LINK ${{ github.ref_name }}
          body: |
            C-LINK, the new CorosLink. Draft: check it, then publish by hand. A beta (prerelease, clink-mac.yml,
            clink.yml, clink-linux.yml) reaches only CorosLink installs on a Mac that opted in, C-LINK betas, and
            people who download it here; a release (latest-mac.yml) reaches every CorosLink on a Mac.
          generate_release_notes: false
          files: |
            release/*
