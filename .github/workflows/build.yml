name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build macOS installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run binaries:prepare:mac
          npm run build
          npx electron-builder --mac --arm64 --x64 --publish never \
            -c.mac.identity=- \
            -c.mac.notarize=false \
            -c.mac.hardenedRuntime=false

      - name: Verify macOS update artifacts
        run: node scripts/verify-release-artifacts.mjs macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coroslink-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:linux

      - name: Verify Linux update artifacts
        run: node scripts/verify-release-artifacts.mjs linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coroslink-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build NSIS installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Verify Windows update artifacts
        run: node scripts/verify-release-artifacts.mjs windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coroslink-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
