[package]
name = "clink-ble"
version = "0.1.0"
edition = "2021"
description = "C-LINK's Bluetooth helper: moves COROS GATT frames for the app over JSON lines on stdin/stdout, on macOS, Windows and Linux."
license = "MIT"
publish = false

[[bin]]
name = "clink-ble"
path = "src/main.rs"

[dependencies]
btleplug = "=0.13.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-std", "io-util"] }
futures = "0.3"
serde_json = "1"
uuid = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Pairing, which btleplug doesn't do: BlueZ's Device1.Pair over D-Bus, WinRT's DeviceInformation.Pairing.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Foundation"] }
